# ============================================================================
# Docker Compose Configuration - App Orchestrator
# ============================================================================
# Services are organized in the following order:
# 1. Infrastructure Services (Databases)
# 2. Application Services (Backend, Frontend)
# ============================================================================
name: app-orchestrator
services:
  # ==========================================================================
  # 1. INFRASTRUCTURE SERVICES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # PostgreSQL Database for Application Orchestrator
  # --------------------------------------------------------------------------

  apporchestrator-postgres:
    image: postgres:14
    restart: always
    environment:
      POSTGRES_USER: ${ORCHESTRATOR_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ORCHESTRATOR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ORCHESTRATOR_POSTGRES_DATABASE}
    expose:
      - 5432
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      retries: 50
    volumes:
      - ${VOLUME_BASE_PATH}/orchestrator/postgres/:/var/lib/postgresql/data
    networks:
      - internal

  # --------------------------------------------------------------------------

  # ==========================================================================
  # 2. APPLICATION SERVICES
  # ==========================================================================

  # --------------------------------------------------------------------------
  # App Orchestrator Backend API (ASP.NET Core)
  # --------------------------------------------------------------------------
  apporchestrator-server:
    image: ${IMAGE_BASE_PATH}/apporchestrator-server:${ORCHESTRATOR_SERVER_TAG}
    restart: always
    expose:
      - 80
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      DOTNET_RUNNING_IN_CONTAINER: "true"
      Keycloak__Host: ${PROTOCOL}://${KEYCLOAK_SERVER_HOSTNAME}
      Keycloak__Realm: ${KEYCLOAK_REALM}
      Keycloak__ClientId: ${KEYCLOAK_SERVER_CLIENT_ID}
      Postgres__Host: apporchestrator-postgres
      Postgres__Port: 5432
      Postgres__User: ${ORCHESTRATOR_POSTGRES_USER}
      Postgres__Password: ${ORCHESTRATOR_POSTGRES_PASSWORD}
      Postgres__Database: ${ORCHESTRATOR_POSTGRES_DATABASE}
      Orchestrator__NetworkTraefik: traefik-proxy
      Orchestrator__RootPath: /orchestrator
    volumes:
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
      - ${VOLUME_BASE_PATH}/orchestrator/server:/orchestrator
      - ${VOLUME_BASE_PATH}/orchestrator/docker-config:/root/.docker
    depends_on:
      apporchestrator-postgres:
        condition: service_healthy
    networks:
      - internal
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.${STACK_NAME}-server.rule=Host(`${ORCHESTRATOR_SERVER_HOSTNAME}`)"
      - "traefik.http.routers.${STACK_NAME}-server.entrypoints=https"
      - "traefik.http.routers.${STACK_NAME}-server.tls.certresolver=letsencrypt"
      - "traefik.http.services.${STACK_NAME}-server.loadbalancer.server.port=80"

  # --------------------------------------------------------------------------
  # App Orchestrator Frontend Client (Vite/React)
  # --------------------------------------------------------------------------
  apporchestrator-client:
    image: ${IMAGE_BASE_PATH}/apporchestrator-client:${ORCHESTRATOR_CLIENT_TAG}
    restart: always
    expose:
      - 80
    environment:
      - VITE_API_URL=${PROTOCOL}://${ORCHESTRATOR_SERVER_HOSTNAME}
      - VITE_MOUNT_PATH=${MOUNT_ROUTE}
      - VITE_KEYCLOAK_AUTHORITY=${PROTOCOL}://${KEYCLOAK_SERVER_HOSTNAME}/realms/${KEYCLOAK_REALM}
      - VITE_KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_CLIENT_ID}
    depends_on:
      - apporchestrator-server
    networks:
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-proxy"
      - "traefik.http.routers.${STACK_NAME}-client.rule=Host(`${ORCHESTRATOR_CLIENT_HOSTNAME}`)"
      - "traefik.http.routers.${STACK_NAME}-client.entrypoints=https"
      - "traefik.http.routers.${STACK_NAME}-client.tls.certresolver=letsencrypt"
      - "traefik.http.services.${STACK_NAME}-client.loadbalancer.server.port=80"

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  # Internal network for service-to-service communication
  internal:
  # External network for Traefik reverse proxy (production only)
  traefik-proxy:
    name: ${TRAEFIK_NETWORK}
    external: true
